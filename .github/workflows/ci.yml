name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        uses: astral-sh/ruff-action@v3

      - name: Check formatting
        uses: psf/black@stable
        with:
          options: "--check --diff"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        # The extension touches the filesystem only through the CLI, but the
        # asset paths are worth exercising on the other platforms.
        include:
          - { python-version: "3.12", os: macos-latest }
          - { python-version: "3.12", os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Test
        run: python -m pytest -v --tb=short
        env:
          # Fail rather than skip if Zensical is missing, so the build tests
          # can never pass by not running.
          ZENSICAL_VARS_REQUIRE_BUILD: "1"

  markdown-versions:
    name: Python-Markdown ${{ matrix.markdown }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The extension registers pre- and postprocessors at specific
        # priorities relative to the fenced-code and raw-HTML stages, so a
        # change in Python-Markdown's internals would break substitution.
        markdown: ["3.4.*", "3.5.*", "3.6.*", "3.7.*", ""]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          if [ -n "${{ matrix.markdown }}" ]; then
            python -m pip install "markdown==${{ matrix.markdown }}"
          fi

      - name: Show versions
        run: python -c "import markdown; print('markdown', markdown.__version__)"

      - name: Test
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: Assets must be inside the wheel
        run: |
          python - <<'EOF'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "zensical_vars/assets/zensical-vars.css",
              "zensical_vars/assets/zensical-vars.js",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit(f"missing from {wheel}: {missing}")
          print(f"{wheel} contains both assets")
          EOF

      - name: Install from the wheel and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          /tmp/smoke/bin/python - <<'EOF'
          import markdown
          from importlib.metadata import entry_points

          groups = {"markdown.extensions", "console_scripts"}
          found = {
              group
              for group in groups
              for ep in entry_points(group=group)
              if "zensical" in ep.name
          }
          assert found == groups, f"missing entry points: {groups - found}"

          html = markdown.Markdown(extensions=["zensical_vars"]).convert(
              "```zvars\nhost: 192.168.1.1\n```\n\n`ssh <<host>>`"
          )
          assert 'data-zv-var="host"' in html, html
          assert "<style" not in html and "<script" not in html, html
          print("wheel installs and renders correctly")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
