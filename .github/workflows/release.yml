name: Release

# Publishes to PyPI when a version tag is pushed. Uses trusted publishing, so
# there is no API token to store: configure the publisher once at
# https://pypi.org/manage/account/publishing/ with this repository, the
# workflow filename `release.yml`, and the environment name `pypi`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'EOF'
          import glob, os, re, sys

          tag = os.environ["GITHUB_REF"].removeprefix("refs/tags/v")
          built = re.search(r"-(.+?)-py3", glob.glob("dist/*.whl")[0]).group(1)
          if tag != built:
              sys.exit(f"tag v{tag} does not match built version {built}")
          print(f"tag and version agree: {built}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zensical-vars
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
